<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leapfrog Prep — Revision Portal</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:1380px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}}

/* sidebar */
.side{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.side a{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--mute);font-size:13.5px}
.side a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.side a.on{background:var(--panel3);color:var(--text)}
.side .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.side .cnt{font-size:11.5px;font-family:var(--mono)}
.side .mini{grid-column:2/4;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:-3px}
.side .mini i{display:block;height:100%;background:var(--c)}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 0}

/* hero */
.hero2{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:78px;height:78px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:20px} .ring small{font-size:11px;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mute)}
.stat b{color:var(--text);font-size:16px;margin-right:4px}

/* toolbar */
.toolbar{position:sticky;top:57px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin:0 0 16px;background:rgba(20,27,24,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius)}
.toolbar input[type=search]{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toolbar input[type=search]:focus{border-color:var(--green2);outline:none}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;user-select:none}
.toggle:has(input:checked){border-color:var(--green2);color:var(--text);background:var(--greenbg)}
.toggle input{accent-color:var(--green)}

/* group */
.grp{scroll-margin-top:130px;border-top:3px solid var(--c);padding:0;overflow:hidden}
.ghead{padding:18px 20px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%)}
.gnum{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--c);color:#0c110f;font-weight:800;margin-right:10px;font-size:15px}
.ghead h2{margin:0;display:flex;align-items:center;font-size:21px}
.idea{margin:10px 0 8px;font-size:15px}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.kw span{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.gbody{padding:4px 20px 18px}
.cluster{margin-top:14px}
.chead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:8px 0}
.chead h3{margin:0;font-size:14.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.chead span{font-size:13px;color:var(--mute)}

/* problem card */
details.prob{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;margin:8px 0;scroll-margin-top:130px;transition:border-color .15s}
details.prob:hover{border-color:var(--line2);border-left-color:var(--c)}
details.prob.done{opacity:.72} details.prob.done[open]{opacity:1}
details.prob>summary{cursor:pointer;padding:12px 14px;list-style:none;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
details.prob>summary::-webkit-details-marker{display:none}
.ptitle{font-weight:650;font-size:15.5px}
.ptitle::before{content:'▸';display:inline-block;width:16px;color:var(--c);transition:transform .15s}
details.prob[open] .ptitle::before{transform:rotate(90deg)}
.take{grid-column:1/2;font-size:14px;color:var(--text);padding-left:16px}
.cx{grid-column:1/2;padding-left:16px;font-size:12px;color:var(--mute);font-family:var(--mono)}
.rev{grid-row:1/3;grid-column:2;align-self:center;font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel3);color:var(--mute);cursor:pointer;white-space:nowrap}
.rev:hover{color:var(--text);border-color:var(--green2)}
.done .rev{background:var(--greenbg);border-color:var(--green2);color:var(--green)}
body.recall .take:not(.shown){filter:blur(6px);cursor:help;user-select:none}
body.recall .take:not(.shown)::after{content:'  (click to reveal)'}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;padding:4px 16px 16px}
@media(max-width:1180px){.pbody{grid-template-columns:1fr}}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;margin:6px 0}
.conn{display:flex;flex-direction:column;gap:6px}
.conn a{display:block;padding:7px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);color:var(--text);font-size:13.5px}
.conn a:hover{border-color:var(--line2);text-decoration:none}
.conn a.todo{opacity:.6}
.conn small{display:block;color:var(--mute);font-size:12.5px}
details.sub{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.sub>summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600}
details.sub[open]>summary{margin-bottom:6px}
.tabs2{display:flex;gap:4px;margin:6px 0 -2px}
.tabs2 button{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;color:var(--mute);cursor:pointer}
.tabs2 button.on{background:#090d0b;border-color:var(--line);color:var(--text)}
.codebox pre{margin-top:0;border-top-left-radius:0}
.open-link{font-size:13px}

.hook{margin:4px 0 10px;padding:8px 12px;border-radius:8px;background:var(--amberbg);border:1px solid #6a5524;font-size:13.5px}
.hook code{background:none;color:var(--amber);font-size:13px;padding:0}
.idea2{font-size:14.5px;line-height:1.6;padding:10px 12px;border-radius:8px;background:var(--panel);border-left:3px solid var(--c)}
ol.algo{margin:4px 0 8px;padding-left:22px;font-size:14px}
ol.algo li{margin:5px 0;padding-left:4px;white-space:pre-wrap}
ol.algo li::marker{color:var(--c);font-weight:700}
.skel{margin:0 20px 6px}
.skel>summary{color:var(--c)!important}
.dry{background:#090d0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.dry ol{margin:8px 0;padding-left:24px;font-family:var(--mono);font-size:12.8px;line-height:1.7}
.dry li{white-space:pre-wrap;padding-left:4px}
.dry li::marker{color:var(--c)}
.dry-io{display:flex;gap:10px;align-items:baseline;font-size:13px}
.dry-io span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;min-width:52px}
.dry-io code{background:var(--panel2);color:var(--text);white-space:pre-wrap;word-break:break-word}
.dry-io.out code{background:var(--greenbg);color:var(--green);font-weight:600}
/* bridge */
.bridge{display:flex;gap:12px;align-items:center;margin:0 20px 18px;padding:11px 14px;border-radius:10px;background:var(--panel);border:1px dashed var(--line2);font-size:14px}
.bridge .arrow{font-size:20px;color:var(--c)}
.bridge a{white-space:nowrap;font-weight:600}

/* tips */
.tipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tip .k{color:var(--mute);font-size:12.5px}
.tip .p{font-weight:650;color:var(--green);margin:2px 0}
.cons{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cons .tip b{font-family:var(--mono);font-size:15px}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 48px;position:relative;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#0c110f;font-weight:800;display:grid;place-items:center;font-size:13px}
.tips h3{margin-top:24px}

.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--green)}to{box-shadow:0 0 0 0 transparent}}
[hidden]{display:none!important}
@media print{.top,.toolbar,.side,.rev{display:none}.layout{display:block}details.prob{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html#/" class="brand"><span class="leaf">⟋</span> leapfrog<b>prep</b> · revise</a>
  <nav><a href="#tips">🧭 Unseen-question tips</a><a href="#memory">🔑 Remembering code</a><a href="index.html#/problems">← Back to practice</a></nav>
  <div class="lang"><label for="lang">Language</label>
    <select id="lang"><option value="py">Python</option><option value="js">JavaScript</option></select></div>
</header>
<main id="app"></main>

<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/python.min.js"></script>
<script src="vendor/codemirror/javascript.min.js"></script>
<script src="vendor/codemirror/runmode.min.js"></script>
<script src="data/lessons.js"></script>
<script src="data/problems-1.js"></script>
<script src="data/problems-2.js"></script>
<script src="data/problems-3.js"></script>
<script src="data/problems-4.js"></script>
<script src="data/revision.js"></script>
<script src="data/algos.js"></script>
<script src="data/memory.js"></script>
<script src="data/dryruns.js"></script>
<script>
// Reads the practice app's progress (lfprep-v1) without writing it; revision state lives in its own key.
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const S = JSON.parse(localStorage.getItem('lfprep-v1') || '{}');
const SP = S.p || {};
const RKEY = 'lfprep-revise';
const R = Object.assign({ done: {}, recall: false }, JSON.parse(localStorage.getItem(RKEY) || '{}'));
const saveR = () => localStorage.setItem(RKEY, JSON.stringify(R));
const P = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
const isSolved = id => !!(SP[id] && SP[id].solved);
const fillBlanks = code => code.replace(/⟦([^⟧]*)⟧/g, (_, a) => a.split('¦')[0]);
const LN = { py: 'Python', js: 'JavaScript' };
const COLORS = ['#3ddc84', '#4dd0e1', '#6cb6ff', '#a78bfa', '#f472b6', '#fb7185', '#ff8a65', '#ffc857', '#a3e635', '#34d399', '#60a5fa', '#c084fc', '#f59e0b', '#94a3b8', '#94a3b8'];
const ago = t => { const d = Math.floor((Date.now() - t) / 864e5); return d < 1 ? 'today' : d === 1 ? 'yesterday' : d + 'd ago'; };
let lang = S.lang || 'py';
let showAll = !PROBLEMS.some(p => isSolved(p.id));

// Self-check: every problem sits in exactly one cluster; leftovers go to an "Other" group so nothing is lost.
const placed = REV_GROUPS.flatMap(g => g.clusters.flatMap(c => c.ids));
placed.forEach((id, i) => { console.assert(P[id], 'unknown id in REV_GROUPS: ' + id); console.assert(placed.indexOf(id) === i, 'duplicate id: ' + id); });
const leftover = PROBLEMS.filter(p => !placed.includes(p.id)).map(p => p.id);
const GROUPS = (leftover.length ? [...REV_GROUPS, { id: 'other', title: 'Other', concept: '', spot: '', clusters: [{ title: 'Uncategorised', ids: leftover, note: '' }], bridge: '' }] : REV_GROUPS)
  .map((g, i) => Object.assign({ color: COLORS[i % COLORS.length] }, g));
const groupOf = Object.fromEntries(GROUPS.flatMap(g => g.clusters.flatMap(c => c.ids.map(id => [id, g]))));

let shown = new Set();
const shownIds = g => g.clusters.flatMap(c => c.ids).filter(id => shown.has(id));

function codeBox(id, mine, mineLang) {
  const ref = fillBlanks(P[id].sol[lang]);
  const tabs = [mine && ['mine', `Your code · ${LN[mineLang]}`, mine, mineLang], ['ref', `Reference · ${LN[lang]}`, ref, lang]].filter(Boolean);
  return `<div class="codebox"><div class="tabs2">${tabs.map(([k, l], i) => `<button data-act="tab" data-k="${k}" class="${i ? '' : 'on'}">${l}</button>`).join('')}</div>
    ${tabs.map(([k, , code, cl], i) => `<pre class="cm-s-lf" data-k="${k}" ${i ? 'hidden' : ''}><code data-lang="${cl}">${esc(code)}</code></pre>`).join('')}</div>`;
}

function probHTML(p, g, c) {
  const st = SP[p.id] || {};
  const other = lang === 'py' ? 'js' : 'py';
  const mineLang = st.code && (st.code[lang] ? lang : st.code[other] ? other : null);
  const done = R.done[p.id];
  const algo = REV_ALGO[p.id], hook = REV_HOOK[p.id];
  const conn = (REV_CONN[p.id] || []).filter(([id]) => P[id]).map(([id, why]) => {
    const tg = groupOf[id];
    return shown.has(id)
      ? `<a href="#p-${id}" style="--c:${tg.color}">${esc(P[id].title)}<small>${esc(why)}</small></a>`
      : `<a class="todo" href="index.html#/p/${id}" style="--c:${tg.color}">${esc(P[id].title)} ↗ <span class="mute small">not solved yet</span><small>${esc(why)}</small></a>`;
  }).join('');
  const search = [p.title, p.takeaway, g.title, c.title, p.pattern].join(' ').toLowerCase();
  return `<details class="prob${done ? ' done' : ''}" id="p-${p.id}" data-id="${p.id}" data-s="${esc(search)}">
    <summary>
      <div class="ptitle">${esc(p.title)} <span class="pill ${p.diff}">${p.diff}</span>${isSolved(p.id) ? '' : ' <span class="pill">unsolved</span>'}</div>
      <button class="rev" data-act="rev">${done ? '✓ Revised ' + ago(done) : 'Mark revised'}</button>
      <div class="take" data-act="reveal">💡 ${esc(p.takeaway)}</div>
      <div class="cx">⏱ ${esc(p.complexity)}</div>
    </summary>
    <div class="pbody">
      <div>
        ${hook ? `<div class="hook">🔑 <b>Memory hook:</b> <code>${esc(hook)}</code></div>` : ''}
        ${algo ? `<div class="lbl">🧠 Concept</div><div class="idea2">${esc(algo.idea)}</div>
        <div class="lbl">🪜 Algorithm, step by step</div><ol class="algo">${algo.steps.map(st => `<li>${st}</li>`).join('')}</ol>` : ''}
        ${conn ? `<div class="lbl">🔗 Connects to</div><div class="conn">${conn}</div>` : ''}
        <details class="sub"><summary>📄 Problem statement</summary>${p.desc}</details>
        <a class="open-link" href="index.html#/p/${p.id}">✍️ Re-solve from scratch in the practice app ↗</a>
      </div>
      <div><div class="lbl">Code</div>${codeBox(p.id, mineLang && st.code[mineLang], mineLang)}${dryHTML(p)}</div>
    </div></details>`;
}

function dryHTML(p) {
  const d = REV_DRY[p.id];
  if (!d) return '';
  const input = d.show || p.params.map((n, i) => `${n} = ${JSON.stringify(d.args[i])}`).join(', ');
  return `<div class="lbl">🔍 Dry run: trace it with your finger</div><div class="dry">
    <div class="dry-io"><span>Input</span><code>${esc(input)}</code></div>
    <ol>${d.steps.map(st => `<li>${esc(st)}</li>`).join('')}</ol>
    <div class="dry-io out"><span>Output</span><code>${esc(JSON.stringify(d.out))}</code></div></div>`;
}

function sideHTML(groups) {
  return groups.map(g => {
    const ids = shownIds(g), n = ids.length, d = ids.filter(id => R.done[id]).length;
    return `<a href="#g-${g.id}" data-g="${g.id}" style="--c:${g.color}"><span class="dot"></span><span>${esc(g.title.split(':')[0].replace(/ \(.*/, ''))}</span><span class="cnt">${d}/${n}</span><span class="mini"><i style="width:${n ? d / n * 100 : 0}%"></i></span></a>`;
  }).join('') + `<hr><a href="#tips" style="--c:var(--amber)"><span class="dot"></span><span>Unseen-question tips</span><span></span></a>`;
}

function heroHTML() {
  const n = shown.size, d = [...shown].filter(id => R.done[id]).length, pct = n ? Math.round(d / n * 100) : 0;
  const solvedCount = PROBLEMS.filter(p => isSolved(p.id)).length;
  return `<div class="hero2"><div class="ring" style="--p:${pct}"><div><span><b>${pct}%</b><br><small>revised</small></span></div></div>
    <div style="flex:1;min-width:260px"><h1 style="margin:0">Revision portal</h1>
      <div class="mute">Read the 💡 line, recall the solution in your head, then open the card to check. Mark it revised when you could explain it.</div>
      <div class="stats"><span class="stat"><b>${solvedCount}</b>solved</span><span class="stat"><b>${d}/${n}</b>revised</span><span class="stat"><b>${GROUPS.filter(g => shownIds(g).length).length}</b>pattern groups</span></div></div></div>`;
}

function render() {
  shown = new Set(PROBLEMS.filter(p => showAll || isSolved(p.id)).map(p => p.id));
  const groups = GROUPS.filter(g => shownIds(g).length);
  const noneSolved = !PROBLEMS.some(p => isSolved(p.id));
  $('#app').innerHTML = `<div class="layout">
  <aside class="side" id="side">${sideHTML(groups)}</aside>
  <div>
    <div class="card" id="hero">${heroHTML()}</div>
    ${noneSolved ? `<div class="card callout"><b>No solved problems found in this browser.</b> Open this page in the browser you practise in (progress is stored per browser), or import your backup on the <a href="index.html#/">Plan</a> page. Showing everything for now.</div>` : ''}
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔎 Filter by name, idea or pattern…">
      <label class="toggle" title="Blur the 💡 concept lines so you test yourself"><input type="checkbox" id="recall" ${R.recall ? 'checked' : ''}> 🙈 Recall mode</label>
      <label class="toggle"><input type="checkbox" id="todo"> Not revised only</label>
      <label class="toggle"><input type="checkbox" id="all" ${showAll ? 'checked' : ''}> Include unsolved</label>
      <button class="btn" data-act="quiz" title="Open a random problem you haven't revised yet">🎲 Quiz me</button>
      <button class="btn ghost" data-act="expand">Expand all</button>
      <button class="btn ghost" data-act="collapse">Collapse all</button>
    </div>
    ${groups.map((g, gi) => {
      const next = groups[gi + 1];
      return `<section class="card grp" id="g-${g.id}" data-g="${g.id}" style="--c:${g.color}">
      <div class="ghead">
        <div class="spread"><h2><span class="gnum">${gi + 1}</span>${esc(g.title)}</h2>${g.id !== 'other' ? `<a class="small" href="index.html#/learn/${g.id}">Full lesson ↗</a>` : ''}</div>
        ${g.concept ? `<div class="idea">${esc(g.concept)}</div><div class="kw"><span style="border:0;background:none;color:var(--mute);padding-left:0">Spot it:</span>${g.spot.split(',').map(k => `<span>${esc(k.trim())}</span>`).join('')}</div>` : ''}
      </div>
      ${REV_SKELETON[g.id] ? `<details class="sub skel"><summary>🧩 Skeleton to memorise: one template for every problem in this group (${LN[lang]})</summary><pre class="cm-s-lf"><code data-lang="${lang}">${esc(REV_SKELETON[g.id][lang])}</code></pre><div class="small mute">CAPS words are the parts you fill in for each problem.</div></details>` : ''}
      <div class="gbody">${g.clusters.filter(c => c.ids.some(id => shown.has(id))).map(c => `<div class="cluster">
        <div class="chead"><h3>${esc(c.title)}</h3><span>${esc(c.note)}</span></div>
        ${c.ids.filter(id => shown.has(id)).map(id => probHTML(P[id], g, c)).join('')}</div>`).join('')}</div>
      ${g.bridge && next ? `<div class="bridge"><span class="arrow">↓</span><span style="flex:1">${esc(g.bridge)}</span><a href="#g-${next.id}" style="color:${next.color}">${gi + 2}. ${esc(next.title.split(':')[0])} →</a></div>` : ''}
    </section>`;
    }).join('')}
    ${tipsHTML()}
  </div></div>`;
  document.body.classList.toggle('recall', R.recall);
  $('#q').oninput = applyFilter;
  $('#todo').onchange = applyFilter;
  $('#all').onchange = e => { showAll = e.target.checked; render(); };
  $('#recall').onchange = e => { R.recall = e.target.checked; saveR(); document.body.classList.toggle('recall', R.recall); $$('.take.shown').forEach(t => t.classList.remove('shown')); };
  highlight();
  watchSections();
  openFromHash();
}

function tipsHTML() {
  const T = REV_TIPS;
  const ref = id => P[id] ? (shown.has(id) ? `<a href="#p-${id}">${esc(P[id].title)}</a>` : `<a class="mute" href="index.html#/p/${id}">${esc(P[id].title)} ↗</a>`) : '';
  return `<section class="card tips grp" id="tips" style="--c:var(--amber)"><div class="ghead"><h2><span class="gnum">🧭</span>Tips & tricks for unseen questions</h2>
    <div class="idea mute">Most "new" questions are a known pattern with one rule changed. Spot the pattern, anchor it to a problem you've solved, then adapt.</div></div>
    <div class="gbody">
    <h3>1. Keyword → pattern</h3><div class="tipgrid">${T.keywords.map(([k, pat, id]) => `<div class="tip"><div class="k">If you see ${esc(k)}</div><div class="p">→ ${esc(pat)}</div><div class="small">Anchor: ${ref(id)}</div></div>`).join('')}</div>
    <h3>2. Input size → target complexity</h3><div class="cons">${T.constraints.map(([n, t, tools]) => `<div class="tip"><div class="k">${esc(n)}</div><b>${esc(t)}</b><div class="small mute">${esc(tools)}</div></div>`).join('')}</div>
    <h3>3. "New" question? It's probably a variant</h3><div class="tipgrid">${T.variants.map(([q, t, id]) => `<div class="tip"><b>${esc(q)}</b><div class="small" style="margin:3px 0">${esc(t)}</div><div class="small mute">Built on: ${ref(id)}</div></div>`).join('')}</div>
    <h3>4. Stuck? Follow these steps in order</h3><ol class="steps">${T.stuck.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <h3 id="memory" style="scroll-margin-top:130px">5. How to remember the code in the exam</h3><ol class="steps">${REV_MEMORY.map(s => `<li>${s}</li>`).join('')}</ol>
    <h3>6. Edge cases to dry-run before submitting</h3><div class="kw">${T.edges.map(e => `<span>☐ ${esc(e)}</span>`).join('')}</div>
    <h3>7. ${LN[lang]} gotchas</h3><ul>${T.gotchas[lang].map(s => `<li>${esc(s)}</li>`).join('')}</ul>
  </div></section>`;
}

function applyFilter() {
  const q = $('#q').value.trim().toLowerCase(), todo = $('#todo').checked;
  $$('details.prob').forEach(d => { d.hidden = (q && !d.dataset.s.includes(q)) || (todo && !!R.done[d.dataset.id]); });
  $$('.cluster').forEach(c => { c.hidden = !$('details.prob:not([hidden])', c); });
  $$('section.grp[data-g]').forEach(s => { s.hidden = !$('details.prob:not([hidden])', s); });
}

function refreshProgress() {
  $('#side').innerHTML = sideHTML(GROUPS.filter(g => shownIds(g).length));
  $('#hero').innerHTML = heroHTML();
  watchSections();
}

function highlight() {
  if (!window.CodeMirror || !CodeMirror.runMode) return;
  $$('pre code[data-lang]').forEach(el => CodeMirror.runMode(el.textContent, el.dataset.lang === 'py' ? 'python' : 'javascript', el));
}

function focusCard(el) {
  el.hidden = false;
  el.open = true;
  el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

// Connection links jump to a card: open it and flash it.
function openFromHash() {
  const el = location.hash.startsWith('#p-') && document.getElementById(location.hash.slice(1));
  if (el) focusCard(el);
}
window.addEventListener('hashchange', openFromHash);

// Highlight the sidebar entry of the section currently on screen.
let io;
function watchSections() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    $$('#side a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
  }), { rootMargin: '-140px 0px -65% 0px' });
  $$('section.grp').forEach(s => io.observe(s));
}

const act = {
  rev(el, e) {
    e.preventDefault(); // don't toggle the <details>
    const card = el.closest('details.prob'), id = card.dataset.id;
    if (R.done[id]) delete R.done[id]; else R.done[id] = Date.now();
    saveR();
    card.classList.toggle('done', !!R.done[id]);
    el.textContent = R.done[id] ? '✓ Revised ' + ago(R.done[id]) : 'Mark revised';
    refreshProgress();
  },
  reveal(el, e) {
    if (!R.recall || el.classList.contains('shown')) return;
    e.preventDefault();
    el.classList.add('shown');
  },
  tab(el) {
    const box = el.closest('.codebox');
    $$('.tabs2 button', box).forEach(b => b.classList.toggle('on', b === el));
    $$('pre', box).forEach(p => { p.hidden = p.dataset.k !== el.dataset.k; });
  },
  quiz() {
    const pool = $$('details.prob:not([hidden])').filter(d => !R.done[d.dataset.id]);
    if (!pool.length) return alert('Everything visible is revised. Nice work! Untick some or clear the filter.');
    $$('details.prob[open]').forEach(d => { d.open = false; });
    const el = pool[Math.floor(Math.random() * pool.length)];
    $('.take', el).classList.remove('shown');
    if (!R.recall) $('#recall').click();
    focusCard(el);
  },
  expand() { $$('details.prob:not([hidden])').forEach(d => { d.open = true; }); },
  collapse() { $$('details.prob').forEach(d => { d.open = false; }); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && act[el.dataset.act]) act[el.dataset.act](el, e);
});

$('#lang').value = lang;
$('#lang').onchange = e => { lang = e.target.value; render(); };
render();
</script>
</body>
</html>
